name: 'Enterprise AI Code Reviewer'
description: 'Multi-LLM AI-powered code review with parallel scanning and intelligent aggregation'
author: 'Enterprise AI Reviewer'

branding:
  icon: 'code'
  color: 'purple'

inputs:
  openrouter-api-key:
    description: 'OpenRouter API key for LLM access'
    required: true
  github-token:
    description: 'GitHub token for API access'
    required: true
  base-url:
    description: 'OpenRouter API base URL'
    required: false
    default: 'https://openrouter.ai/api/v1'
  scanner-models:
    description: 'Scanner models (CSV, multiline, or JSON array). Required unless auto-select-models is true.'
    required: true
  scanner-roles:
    description: >-
      Roles for scanner models, in the same three formats as scanner-models
      (multiline, CSV, or JSON array). Valid values: security, logic,
      performance, general. A single value applies to all scanners; a list must
      match the scanner-models length (one role per model, index-aligned). When
      unset, 1-2 scanners get "general" and 3+ scanners round-robin security,
      logic, performance across the model list. This is a separate input rather
      than a "model:role" suffix because OpenRouter model IDs already use ":"
      for variants (e.g. ":free").
    required: false
    default: ''
  judge-model:
    description: 'Model to use for aggregation/judging'
    required: true
  language:
    description: 'Output language for AI review (tr, en, etc.)'
    required: false
    default: 'tr'
  auto-select-models:
    description: 'Auto-select models based on PR size (not implemented in MVP - provide scanner-models)'
    required: false
    default: 'false'
  max-files:
    description: 'Maximum number of files to review'
    required: false
    default: '10'
  max-chars:
    description: 'Maximum characters in diff to review'
    required: false
    default: '80000'
  timeout-ms:
    description: >-
      Timeout for each API call attempt in milliseconds. Every call (scanners,
      judge scan, aggregation judge) retries a timeout at most once; 429/5xx,
      network and empty-response retries keep the full budget (up to 3).
    required: false
    default: '600000'
  max-tokens-scanner:
    description: >-
      Maximum tokens for scanner responses, including reasoning tokens on
      budget-based reasoning models (see scanner-reasoning-effort)
    required: false
    default: '8000'
  max-tokens-judge:
    description: >-
      Maximum tokens for judge response, including reasoning tokens on
      budget-based reasoning models (see judge-reasoning-effort)
    required: false
    default: '32000'
  comment-marker:
    description: 'Marker for finding/updating PR comment'
    required: false
    default: 'ENTERPRISE_AI_REVIEW'
  review-mode:
    description: 'Review output mode: "summary" posts a single PR comment, "inline" posts review comments on specific diff lines'
    required: false
    default: 'summary'
  exclude-paths:
    description: >-
      Glob patterns for files to exclude from review (CSV, multiline, or JSON array).
      When empty, defaults to: **/package-lock.json, **/yarn.lock, **/pnpm-lock.yaml,
      **/*.min.js, **/*.min.css, **/*.snap, **/dist/**, **/build/**, **/vendor/**.
      Set to the literal value "none" (case-insensitive) to disable all exclusions.
    required: false
    default: ''
  rescue-models:
    description: >-
      Models used for the automatic rescue pass when a role ends up with zero
      successful scanners (same formats as scanner-models: CSV, multiline, or
      JSON array). When empty, the fastest successful model of the run is
      reused — rescue works with zero configuration.
    required: false
    default: ''
  judge-scan:
    description: >-
      When the judge model also runs a scan of its own. "always" (default)
      runs one extra scan with the judge/judge-scan model on every run, in
      parallel with the regular scanners. "fallback" runs it only when a role
      is still uncovered after the rescue pass or when no scanner succeeded at
      all. "off" never runs it. Findings from this scan are rendered with the
      source judge-scan:<model>.
    required: false
    default: 'always'
  judge-scan-role:
    description: >-
      Scanner role used for the judge scan. Valid values: security, logic,
      performance, general.
    required: false
    default: 'general'
  judge-scan-model:
    description: >-
      Model used for the judge scan. Defaults to judge-model when empty —
      setting it lets scanning and aggregation be split across two strong
      models.
    required: false
    default: ''
  judge-reasoning-effort:
    description: >-
      OpenRouter reasoning effort for the aggregation judge and the judge scan,
      sent as reasoning.effort. Valid values: none, low, medium, high, xhigh.
      For budget-based models (e.g. Anthropic) OpenRouter reserves a share of
      max-tokens-judge for reasoning (high = 80%). An empty-response retry
      lowers the effort at most to medium. Providers that reject the
      parameter are retried without it.
    required: false
    default: 'high'
  scanner-reasoning-effort:
    description: >-
      OpenRouter reasoning effort for regular scanners and the rescue pass,
      sent as reasoning.effort. Valid values: none, low, medium, high, xhigh.
      Budget-based models reserve a share of max-tokens-scanner for reasoning
      (medium = 50%). An empty-response retry drops the effort to low.
    required: false
    default: 'medium'
  judge-provider-sort:
    description: >-
      OpenRouter provider routing for both judge calls (aggregation and the
      judge scan), sent as provider: { sort, allow_fallbacks: true }. Valid values: price,
      throughput, latency. Set to an empty string to send no provider block
      (OpenRouter default load balancing).
    required: false
    default: 'price'
  min-successful-scanners:
    description: >-
      Minimum number of successful scanner-pool entries (regular scanners +
      rescue pass + judge scan) required for the review to proceed; the action
      fails when fewer succeed. Set to 0 to disable the check.
    required: false
    default: '1'

outputs:
  total-tokens:
    description: 'Total LLM tokens used across all scanners and the judge'
  findings-count:
    description: 'Number of inline findings produced by the judge (0 in summary mode or when parsing fails)'
  scanners-failed:
    description: 'Number of scanner models that failed'

runs:
  using: 'node24'
  main: 'dist/index.js'
