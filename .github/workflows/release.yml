name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist matches the tagged commit
        run: |
          git diff --exit-code dist/ || (echo "::error::dist/ is stale at ${GITHUB_REF_NAME} — run npm run build, commit dist/, and re-tag" && exit 1)

      - name: Move floating latest and major tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_REF_NAME}"
          git push origin latest -f
          # Floating major tag (GitHub Actions convention): v0.x.y -> v0
          MAJOR_TAG="${GITHUB_REF_NAME%%.*}"
          git tag -f "${MAJOR_TAG}" "${GITHUB_REF_NAME}"
          git push origin "${MAJOR_TAG}" -f

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes
